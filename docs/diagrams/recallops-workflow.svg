<text x="1017" y="586" fill="#9a4936" font-size="21" font-weight="700" font-family="Arial, Helvetica, sans-serif">The same 24-unit hold stays</text>
<path d="M456 393 H506" fill="none" stroke="#56786a" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M928 393 H978" fill="none" stroke="#56786a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="48" y="660" fill="#173f38" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">Evidence experiment: remove the confirmed delivery → review; include it → affected.</text>
<text x="48" y="697" fill="#536b63" font-size="21" font-weight="400" font-family="Arial, Helvetica, sans-serif">The experiment does not change operational holds. An internal hold does not block a real checkout.</text>
