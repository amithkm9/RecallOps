<text x="48" y="104" fill="#173f38" font-size="38" font-weight="700" font-family="Arial, Helvetica, sans-serif">Same stock. New evidence. A traceable decision.</text>
<text x="48" y="144" fill="#536b63" font-size="22" font-weight="400" font-family="Arial, Helvetica, sans-serif">Historical official recall 2024-12-0201 · Fictional store, shipments and quantities</text>
