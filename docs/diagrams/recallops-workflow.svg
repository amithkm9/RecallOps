<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="730" viewBox="0 0 1440 730" role="img" aria-labelledby="title desc">
<title id="title">RecallOps: one recall, three evidence states</title><desc id="desc">A fictional shop has 18 packets in another batch and 24 without a batch. Confirming delivery D-104 establishes a recalled batch and creates an internal hold. A later supplier contradiction preserves the hold and reopens review.</desc>
<rect width="1440" height="730" rx="28" fill="#f6f8f2"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#56786a"/></marker></defs>
