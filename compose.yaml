services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recallops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recallops}
      POSTGRES_DB: recallops
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recallops -d recallops"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://recallops:${POSTGRES_PASSWORD:-recallops}@db:5432/recallops
      ENVIRONMENT: ${ENVIRONMENT:-development}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      LLM_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY:-${openai_api_key:-}}}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      DEMO_ENABLED: "true"
      PUBLIC_DEMO: ${PUBLIC_DEMO:-false}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      SOURCE_REFRESH_SECONDS: ${SOURCE_REFRESH_SECONDS:-3600}
      SOURCE_MAX_RECORDS: ${SOURCE_MAX_RECORDS:-1000}
      MUTATION_LIMIT_PER_MINUTE: ${MUTATION_LIMIT_PER_MINUTE:-120}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
